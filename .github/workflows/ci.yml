name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # configure.ac requires autoconf >= 2.72, newer than ubuntu-latest ships
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y autoconf automake gcc make
      - run: autoreconf && ./configure && make check
